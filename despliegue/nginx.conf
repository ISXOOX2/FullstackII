# Nginx: el ÚNICO punto de entrada (un solo link, puerto 80).
#  - /                -> el frontend React ya compilado (dist)
#  - /api/v1/<ms>     -> el microservicio que corresponde
#  - /docs/<ms>/      -> el Swagger de cada microservicio
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    # Encabezados comunes al reenviar a los microservicios
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # ── API (las rutas se reenvían tal cual) ─────────────────────────────
    location /api/v1/usuarios { proxy_pass http://ms-auth:8081; }      # login, registro, JWT y cuentas
    location /api/v1/catalogo { proxy_pass http://ms-catalogo:8082; }
    location /api/v1/reservas { proxy_pass http://ms-reservas:8083; }
    location /api/v1/blog     { proxy_pass http://ms-catalogo:8082; }  # el blog vive en ms-catalogo

    # ── Swagger de cada microservicio: http://IP/docs/auth/swagger-ui.html ───
    location /docs/auth/     { proxy_set_header X-Forwarded-Prefix /docs/auth;     proxy_pass http://ms-auth:8081/; }
    location /docs/catalogo/ { proxy_set_header X-Forwarded-Prefix /docs/catalogo; proxy_pass http://ms-catalogo:8082/; }
    location /docs/reservas/ { proxy_set_header X-Forwarded-Prefix /docs/reservas; proxy_pass http://ms-reservas:8083/; }

    # ── Frontend: cualquier otra ruta la resuelve React Router (BrowserRouter) ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché por mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
