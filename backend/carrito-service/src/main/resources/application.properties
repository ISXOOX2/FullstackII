# ───────────────────────── carrito-service ─────────────────────────
spring.application.name=carrito-service
server.port=8083

# Base de datos propia del microservicio ("base de datos por microservicio", guía 2.2.1).
spring.datasource.url=jdbc:mysql://localhost:3306/foreverink_carritos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Migraciones con Flyway (guía 2.2.1): NO se usa ddl-auto para crear tablas. Al arrancar,
# Flyway ejecuta en orden los scripts de src/main/resources/db/migration (V1__init.sql,
# V2__...) que aún no se han aplicado, y anota cuáles ejecutó en la tabla flyway_schema_history.
# Regla: un script ya ejecutado no se modifica; los cambios van en un script nuevo (V3__...).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
# Si la base ya tenía tablas de una ejecución anterior (sin historial de Flyway), la toma como punto de partida.
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false

# Dirección de producto-service (Feign). Regla de oro: los datos de productos se piden por su API,
# nunca leyendo su base de datos.
servicios.producto.url=http://localhost:8081

# Buena práctica (guía 2.2.1): manejar timeouts al comunicar microservicios.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

cors.origenes=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:5500

logging.level.cl.duoc.foreverink=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [${spring.application.name}] %logger{0} - %msg%n
