# ───────────────────────── producto-service ─────────────────────────
spring.application.name=producto-service
server.port=8081

# Base de datos propia del microservicio ("base de datos por microservicio", guía 2.2.1).
# createDatabaseIfNotExist=true: si la base no existe en MySQL (XAMPP/Laragon), se crea sola.
spring.datasource.url=jdbc:mysql://localhost:3306/foreverink_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# NO se usa ddl-auto para crear tablas (guía 2.2.1): la estructura y los datos iniciales
# vienen de scripts SQL versionados que Spring Boot ejecuta al arrancar.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/scripts/V1__estructura.sql
spring.sql.init.data-locations=classpath:db/scripts/V2__datos_iniciales.sql

# JWT: la misma clave secreta que usa usuario-service para firmar los tokens.
jwt.secret=Rm9yZXZlckluay1EU1kxMTA0LWNsYXZlLXNlY3JldGEtcGFyYS1maXJtYXItand0LTIwMjY=

# Orígenes del frontend que pueden llamar a esta API (Vite y Live Server).
cors.origenes=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:5500

# Logs (SLF4J + Logback, guía 2.3.2): formato fijo para que se puedan leer y analizar.
logging.level.cl.duoc.foreverink=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [${spring.application.name}] %logger{0} - %msg%n
