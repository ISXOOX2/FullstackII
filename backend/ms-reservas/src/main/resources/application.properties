# ── ms-reservas ─────────────────────────────────────────────────────────────
# Los valores ${VARIABLE:por-defecto} se pueden cambiar con variables de entorno
# (asi en AWS no hay contrasenas escritas en el codigo).
spring.application.name=ms-reservas
server.port=${PORT:8083}

# Base de datos MySQL (XAMPP/Laragon: usuario root sin contrasena). La base se crea sola.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foreverink_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: la MISMA clave en los cuatro microservicios (el token lo firma ms-usuarios y los demas lo verifican)
jwt.secreto=${JWT_SECRETO:forever-ink-clave-de-desarrollo-cambiala-en-aws-minimo-32-caracteres}
jwt.expiracion-ms=28800000

# Origenes que pueden llamar a la API desde el navegador (CORS), separados por coma
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173}

# Swagger: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ms-catalogo: de ahi salen los precios reales y ahi se descuenta el stock de la Tienda
app.catalogo.url=${CATALOGO_URL:http://localhost:8082/api/v1/catalogo}

# Detrás de Nginx: respeta X-Forwarded-Prefix para que Swagger funcione en /docs/reservas/
server.forward-headers-strategy=framework
