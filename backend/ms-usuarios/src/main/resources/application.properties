# ── ms-usuarios ─────────────────────────────────────────────────────────────
# Los valores ${VARIABLE:por-defecto} se pueden cambiar con variables de entorno
# (asi en AWS no hay contrasenas escritas en el codigo).
spring.application.name=ms-usuarios
server.port=${PORT:8081}

# Base de datos MySQL (XAMPP/Laragon: usuario root sin contrasena). La base se crea sola.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foreverink_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: la MISMA clave en los cuatro microservicios (el token lo firma ms-usuarios y los demas lo verifican)
jwt.secreto=${JWT_SECRETO:forever-ink-clave-de-desarrollo-cambiala-en-aws-minimo-32-caracteres}
# Duración del token (8 horas). Para mostrar la renovación en la defensa se puede bajar, ej: JWT_EXPIRACION_MS=840000 (14 min)
jwt.expiracion-ms=${JWT_EXPIRACION_MS:28800000}

# Origenes que pueden llamar a la API desde el navegador (CORS), separados por coma
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173}

# Swagger: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Detrás de Nginx: respeta X-Forwarded-Prefix para que Swagger funcione en /docs/usuarios/
server.forward-headers-strategy=framework

# Contrasenas de las cuentas iniciales (administrador, vendedor y cliente de ejemplo).
# En AWS se definen en el .env; si quedan vacias se usan las de datos/usuarios.json (solo desarrollo).
app.clave-inicial.administrador=${ADMIN_PASSWORD:}
app.clave-inicial.vendedor=${VENDEDOR_PASSWORD:}
app.clave-inicial.cliente=${CLIENTE_PASSWORD:}
