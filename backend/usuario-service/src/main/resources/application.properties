# ───────────────────────── usuario-service ─────────────────────────
spring.application.name=usuario-service
server.port=8082

# Base de datos propia del microservicio ("base de datos por microservicio", guía 2.2.1).
spring.datasource.url=jdbc:mysql://localhost:3306/foreverink_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Estructura y datos iniciales con scripts SQL versionados (no ddl-auto, guía 2.2.1).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/scripts/V1__estructura.sql
spring.sql.init.data-locations=classpath:db/scripts/V2__datos_iniciales.sql

# JWT (guía 2.3.2): clave secreta en Base64 (la misma en producto-service) y duración del token.
jwt.secret=Rm9yZXZlckluay1EU1kxMTA0LWNsYXZlLXNlY3JldGEtcGFyYS1maXJtYXItand0LTIwMjY=
jwt.expiracion-minutos=120

cors.origenes=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:5500

logging.level.cl.duoc.foreverink=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [${spring.application.name}] %logger{0} - %msg%n
