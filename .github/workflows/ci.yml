# CI del frontend: pruebas unitarias, el front real contra los 3 microservicios y el despliegue con Docker.
# El backend se descarga de su propio repositorio (ISXOOX2/Forever_Ink_Backend) en la carpeta backend/.
name: CI (frontend + backend)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pruebas unitarias (Vitest) y compilación
        run: npm ci && npm test && npm run build

  frontend-con-backend:
    # El frontend real (VITE_USAR_API=true) contra los 3 microservicios: compra, reembolso y aprobación en un navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el backend (repositorio Forever_Ink_Backend)
        uses: actions/checkout@v4
        with:
          repository: ISXOOX2/Forever_Ink_Backend
          path: backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/*/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compilar y levantar los 3 microservicios (H2)
        env:
          TZ: America/Santiago
          CATALOGO_URL: http://localhost:8082/api/v1/catalogo
          # Token de 14 minutos: como quedan menos de 15, el front lo renueva en la primera petición
          JWT_EXPIRACION_MS: '840000'
        run: |
          for par in auth:8081 catalogo:8082 reservas:8083; do
            ms=${par%%:*}; puerto=${par##*:}
            (cd backend/ms-$ms && mvn -B -q package -DskipTests)
            nohup java -jar backend/ms-$ms/target/ms-$ms-1.0.0.jar --spring.profiles.active=h2 --server.port=$puerto > /tmp/ms-$ms.log 2>&1 &
          done
          for p in 8081 8082 8083; do for i in $(seq 1 90); do curl -sf http://localhost:$p/v3/api-docs >/dev/null && break; sleep 2; done; done
      - name: Compilar el frontend apuntando a la API
        env:
          VITE_USAR_API: 'true'
          VITE_API_USUARIOS: http://localhost:8081/api/v1/usuarios
          VITE_API_CATALOGO: http://localhost:8082/api/v1/catalogo
          VITE_API_RESERVAS: http://localhost:8083/api/v1/reservas
          VITE_API_BLOG: http://localhost:8082/api/v1/blog
        run: npm ci && npm run build
      - name: Prueba de punta a punta (Playwright)
        env:
          TZ: America/Santiago
        run: |
          nohup npx vite preview --port 4173 --strictPort > /tmp/front.log 2>&1 &
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          node e2e/integracion-front.mjs
      - name: Registros si algo falla
        if: failure()
        run: for f in /tmp/ms-*.log /tmp/front.log; do echo "== $f"; tail -60 $f; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captura-error
          path: e2e-error.png

  despliegue-docker:
    # Lo mismo que se hará en AWS: docker compose levanta MySQL + 3 microservicios + Nginx con el front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el backend (repositorio Forever_Ink_Backend)
        uses: actions/checkout@v4
        with:
          repository: ISXOOX2/Forever_Ink_Backend
          path: backend
      - name: docker compose up
        env:
          ADMIN_PASSWORD: Tinta#2026
          VENDEDOR_PASSWORD: Venta#2026
        run: docker compose up -d --build
      - name: Revisar el sitio por el único link (http://localhost)
        run: |
          revisar() { if eval "$2"; then echo "✔ $1"; else echo "✘ $1"; exit 1; fi; }
          for i in $(seq 1 60); do curl -sf http://localhost/api/v1/catalogo/disenos >/dev/null && break; sleep 5; done
          revisar "frontend servido por Nginx" "curl -sf http://localhost/ | grep -q 'id=\"root\"'"
          revisar "rutas de React (BrowserRouter) funcionan al recargar" "curl -sf http://localhost/blogs | grep -q 'id=\"root\"'"
          revisar "ms-catalogo con MySQL" "test \"\$(curl -sf http://localhost/api/v1/catalogo/disenos | jq length)\" = 30"
          revisar "blog (en ms-catalogo) con MySQL" "test \"\$(curl -sf http://localhost/api/v1/blog | jq length)\" = 2"
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"correo":"admin.foreverink@gmail.com","password":"Admin#123"}' http://localhost/api/v1/usuarios/auth/login)
          revisar "la contraseña de ejemplo del repositorio NO sirve en el servidor (401)" "test $CODIGO = 401"
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"correo":"admin.foreverink@gmail.com","password":"Tinta#2026"}' http://localhost/api/v1/usuarios/auth/login | jq -r .token)
          revisar "Flyway creó las tablas e insertó los 3 tatuadores (V2) en MySQL" "test \"\$(curl -sf http://localhost/api/v1/catalogo/tatuadores | jq length)\" = 3"
          revisar "login JWT y ms-reservas consulta a ms-catalogo dentro de Docker" "test \"\$(curl -sf -H 'Authorization: Bearer $TOKEN' http://localhost/api/v1/reservas/agenda | jq length)\" = 3"
          for ms in auth catalogo reservas; do
            revisar "Swagger de ms-$ms en /docs/$ms/swagger-ui.html" "curl -sfL http://localhost/docs/$ms/swagger-ui.html | grep -qi swagger"
            revisar "OpenAPI de ms-$ms apunta a /docs/$ms" "curl -sf http://localhost/docs/$ms/v3/api-docs | jq -r '.servers[0].url' | grep -q '/docs/$ms'"
          done
      - name: Registros si algo falla
        if: failure()
        run: docker compose logs --tail=80
